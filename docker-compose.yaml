services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagewise-api

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started

    restart: unless-stopped

    volumes:
      - .:/app

    env_file:
      - .env

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

    mem_limit: 512m
    mem_reservation: 256m

    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Run migrations manually on demand:
  # docker compose --profile migration run --rm alembic
  alembic:
    profiles:
      - migration
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagewise-alembic

    depends_on:
      postgres:
        condition: service_started

    volumes:
      - .:/app

    env_file:
      - .env

    command: alembic upgrade head

    restart: "no"

    mem_limit: 256m
    mem_reservation: 128m

  redis:
    image: redis:7-alpine
    container_name: pagewise-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""

    mem_limit: 128m
    mem_reservation: 64m

  postgres:
    image: postgres:16-alpine
    container_name: pagewise-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: pagewiseuser
      POSTGRES_PASSWORD: pagewisepassword
      POSTGRES_DB: pagewisedb

    ports:
      - "5432:5432"

    volumes:
      - pagewise_postgres_data:/var/lib/postgresql/data

    mem_limit: 512m
    mem_reservation: 256m

volumes:
  pagewise_postgres_data:
